apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
      - name: python-app

        image: ACCOUNT-ID.dkr.ecr.ap-south-1.amazonaws.com/python-app:latest

        ports:
        - containerPort: 5000

        ----

apiVersion: v1
kind: Service

metadata:
  name: python-app-service

spec:
  type: NodePort

  selector:
    app: python-app

  ports:
  - port: 80
    targetPort: 5000
