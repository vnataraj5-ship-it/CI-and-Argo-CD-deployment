apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:

      imagePullSecrets:
      - name: ecr-secret

      containers:
      - name: python-app
        image: 583067668082.dkr.ecr.ap-south-1.amazonaws.com/python-app:6
        imagePullPolicy: Always

        ports:
        - containerPort: 5000
